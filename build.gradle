plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.5'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

sourceSets {
    main {
        java {
            exclude 'generated/**'
        }
    }
}

application {
    mainClass = 'org.example.server.GrpcServer'
}

repositories {
    mavenCentral()
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.2.0'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.3.0'
        }
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

dependencies {
    implementation 'io.grpc:grpc-all:1.3.0'
    implementation 'io.grpc:grpc-services:1.3.0'
    implementation 'com.fazecast:jSerialComm:2.11.0'
    implementation 'org.apache.groovy:groovy-ant:4.0.22'
    implementation 'com.influxdb:influxdb-client-java:6.12.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

test {
    useJUnitPlatform()
}

jar {
    from {
        configurations.runtimeClasspath.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Main-Class': 'org.example.server.GrpcServer'
        )
    }
}

tasks.register('copyToLib', Copy) {
    into "$buildDir/output/lib"
    from configurations.runtimeClasspath
}
