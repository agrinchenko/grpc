syntax = "proto3";

option java_package = "org.example.grpc";

//service definition
//service calls
service user {
  rpc login(LoginRequest) returns (ApiResponse);

  rpc logout(Empty) returns (ApiResponse);
}

//GQ GMC-500 Geiger Counter Service
service RadiationProvider {
  rpc serverSideStreamingCpmCounts(Empty) returns (stream CpmCount);
}

//service messages that are used by the service calls
message LoginRequest {
  string username = 1;
  string password = 2;
}

message ApiResponse {
  string responseMessage = 1;
  string responseCode = 2;
}

message Empty {}

message CpmCount {
  int32 count = 1;
}

